<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConnecFriend - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6">

  <!-- Header Navbar -->
  <header class="max-w-5xl mx-auto flex items-center justify-between p-4 bg-slate-900 border border-slate-800 rounded-full mb-8">
    <a href="home.html" class="font-black text-xl text-emerald-400">ConnecFriend</a>
    <nav class="flex gap-4 text-sm">
      <a href="home.html" class="text-emerald-400 font-bold">Home</a>
      <a href="profile.html" class="text-slate-400 hover:text-white">Profile & People</a>
    </nav>
    <button onclick="logout()" class="text-xs text-amber-400 font-bold border border-amber-400/20 px-3 py-1.5 rounded-full hover:bg-amber-400/10">Sign Out</button>
  </header>

  <main class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Feed Area -->
    <section class="lg:col-span-2 space-y-6">
      
      <!-- Create Post Widget -->
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <h2 class="font-bold text-lg mb-3">Share an Update</h2>
        <textarea id="postContent" placeholder="What's on your mind?" class="w-full p-3 rounded-xl bg-slate-950 border border-slate-800 text-sm mb-3 outline-none focus:border-emerald-400" rows="3"></textarea>
        
        <div class="flex flex-wrap items-center justify-between gap-3 text-xs">
          <!-- Share with All vs Specific Friends Option -->
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="audience" value="all" checked onclick="toggleFriendPicker(false)" class="accent-emerald-400"> All Friends
            </label>
            <label class="flex items-center gap-1 cursor-pointer">
              <input type="radio" name="audience" value="some" onclick="toggleFriendPicker(true)" class="accent-emerald-400"> Some Friends
            </label>
          </div>
          <button onclick="createPost()" class="bg-emerald-400 text-slate-950 font-bold px-4 py-2 rounded-xl hover:bg-emerald-300">Share Post</button>
        </div>

        <!-- Friend Selector Checkboxes -->
        <div id="friendPicker" class="hidden mt-3 p-3 bg-slate-950 rounded-xl border border-slate-800 grid grid-cols-2 gap-2 text-xs"></div>
      </div>

      <!-- Feed Container -->
      <div id="feedContainer" class="space-y-4"></div>
    </section>

    <!-- Sidebar: Private Message UI -->
    <aside class="space-y-6">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <h2 class="font-bold text-lg mb-1">💬 Private Messages</h2>
        <p class="text-xs text-slate-400 mb-4">Message any user (friends or non-friends)</p>

        <label class="block text-xs font-semibold mb-2">Select Member:
          <select id="chatUser" onchange="loadMessages()" class="w-full mt-1 p-2 rounded-xl bg-slate-950 border border-slate-800 text-white outline-none"></select>
        </label>

        <div id="messageHistory" class="h-40 overflow-y-auto bg-slate-950 border border-slate-800 p-3 rounded-xl mb-3 text-xs space-y-2"></div>

        <div class="flex gap-2">
          <input id="messageText" type="text" placeholder="Write message..." class="flex-1 p-2 rounded-xl bg-slate-950 border border-slate-800 text-xs outline-none focus:border-amber-400">
          <button onclick="sendMessage()" class="bg-amber-400 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs hover:bg-amber-300">Send</button>
        </div>
      </div>
    </aside>

  </main>

  <script src="js/app.js"></script>
  <script>initHome();</script>
</body>
</html>
