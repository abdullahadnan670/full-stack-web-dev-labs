<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ConnecFriend - Profile & People</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6">

  <!-- Header Navbar -->
  <header class="max-w-5xl mx-auto flex items-center justify-between p-4 bg-slate-900 border border-slate-800 rounded-full mb-8">
    <a href="home.html" class="font-black text-xl text-emerald-400">ConnecFriend</a>
    <nav class="flex gap-4 text-sm">
      <a href="home.html" class="text-slate-400 hover:text-white">Home</a>
      <a href="profile.html" class="text-emerald-400 font-bold">Profile & People</a>
    </nav>
    <button onclick="logout()" class="text-xs text-amber-400 font-bold border border-amber-400/20 px-3 py-1.5 rounded-full hover:bg-amber-400/10">Sign Out</button>
  </header>

  <main class="max-w-5xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

    <!-- Personal Info Card -->
    <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl h-fit">
      <div id="profileCard"></div>
    </section>

    <section class="lg:col-span-2 space-y-6">

      <!-- Friends List with Scale 1-3 Rating -->
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <h2 class="text-xl font-bold mb-1">Your Friends List</h2>
        <p class="text-xs text-slate-400 mb-4">Rate friends: 1 = 🤪 Stupid, 2 = 😎 Cool, 3 = 🛡️ Trustworthy</p>
        <div id="friendsList" class="space-y-3"></div>
      </div>

      <!-- Add Friend / Invite (With Ignore List Check) -->
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl">
        <h2 class="text-xl font-bold mb-1">Find & Connect People</h2>
        <p class="text-xs text-slate-400 mb-4">Send friend request to expand your circle</p>
        <div id="otherUsersList" class="space-y-3"></div>
      </div>

    </section>

  </main>

  <script src="js/app.js"></script>
  <script>initProfile();</script>
</body>
</html>
