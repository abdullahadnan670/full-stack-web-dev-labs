<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator UI</title>
  <style>
    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #eef2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Calculator Container */
    .calculator {
      width: 320px;
      background-color: #1e222d;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.3);
    }

    /* Display Screen */
    .display {
      width: 100%;
      height: 80px;
      background-color: #14171e;
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 2.2rem;
      text-align: right;
      padding: 15px;
      margin-bottom: 20px;
      outline: none;
    }

    /* Button Grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    /* Individual Button Styles */
    button {
      height: 60px;
      border: none;
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 600;
      cursor: pointer;
      background-color: #2d3342;
      color: #ffffff;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    /* Hover & Click Effects */
    button:hover {
      background-color: #3b4254;
    }

    button:active {
      transform: scale(0.95);
    }

    /* Special Buttons Styling */
    .btn-action {
      background-color: #3e4756;
      color: #00d2ff;
    }

    .btn-action:hover {
      background-color: #4b5668;
    }

    .btn-operator {
      background-color: #ff9500;
      color: #ffffff;
    }

    .btn-operator:hover {
      background-color: #e08300;
    }

    .btn-equal {
      background-color: #00d2ff;
      color: #14171e;
      grid-column: span 2; /* Spans across 2 columns */
    }

    .btn-equal:hover {
      background-color: #00b8e6;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Calculator Display -->
    <input type="text" class="display" value="0" readonly>

    <!-- Calculator Buttons Layout -->
    <div class="buttons">
      <button class="btn-action">C</button>
      <button class="btn-action">±</button>
      <button class="btn-action">%</button>
      <button class="btn-operator">÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="btn-operator">×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="btn-operator">-</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="btn-operator">+</button>

      <button>0</button>
      <button>.</button>
      <button class="btn-equal">=</button>
    </div>
  </div>

</body>
</html>
